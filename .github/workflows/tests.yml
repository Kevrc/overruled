name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest tests --ignore=tests/test_trial.py -q
        env:
          OVERRULED_OFFLINE: "1"
      - run: uv run python -m evals.clerk_eval
      - run: uv run python -m evals.benchmark
      - run: uv run python -m evals.company
