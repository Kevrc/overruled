name: clean install
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: scripts/install.sh
      - name: Start the court with scripted speeches
        run: |
          OVERRULED_OFFLINE=1 OVERRULED_TESTIMONY_SECONDS=4 nohup scripts/start.sh > court.log 2>&1 &
          for i in $(seq 1 60); do grep -q 'jury-3 connected' court.log && break; sleep 2; done
          grep -q 'jury-3 connected' court.log
      - run: uv run pytest tests/test_trial.py -q
      - if: failure()
        run: |
          tail -60 court.log || true
          docker ps -a --format '{{.Names}} {{.Status}}' || true
  failover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: scripts/install.sh
      - name: Start the court with the defender offline
        run: |
          OVERRULED_DOWN=defender OVERRULED_OFFLINE=1 OVERRULED_TESTIMONY_SECONDS=4 nohup scripts/start.sh > court.log 2>&1 &
          for i in $(seq 1 60); do grep -q 'jury-3 connected' court.log && break; sleep 2; done
          grep -q 'jury-3 connected' court.log
          sleep 15  # counsel checks the free seat a few seconds after starting
      - run: uv run pytest tests/test_trial.py -q -k counsel
        env:
          OVERRULED_FAILOVER: "1"
      - if: failure()
        run: |
          tail -60 court.log || true
          docker ps -a --format '{{.Names}} {{.Status}}' || true
